name: Cron - sweep abandoned holds

# docs/production-readiness.md §2.2. Runs as a scheduled GitHub Actions
# workflow rather than a platform-specific cron (Vercel Cron / Cloud
# Scheduler) because no deploy target is chosen yet — this works under any
# future host. Add APP_URL (Settings -> Secrets and variables -> Actions ->
# Variables) and CRON_SECRET (-> Secrets, matching the value in the deployed
# app's env) before this can pass; until then a red run here just means
# there's nothing deployed to sweep yet.
on:
  schedule:
    # Every three minutes, not every fifteen. The supplier's hold is fifteen
    # minutes and a booking is only recoverable inside it, so a quarter-hourly
    # sweep gave a guest whose browser died exactly one chance to be rescued -
    # and none at all if the tick landed in the first two minutes, or if GitHub
    # delayed the run, which it routinely does under load. Raised by the NOS-5
    # security review.
    # FIVE, NOT THREE. GitHub: "The shortest interval you can run scheduled
    # workflows is once every 5 minutes." A `*/3` schedule is not honoured, so
    # the file was claiming a cadence that never happened. Verified against the
    # Actions documentation, 2026-10-10.
    #
    # THIS TRIGGER IS NOT GOOD ENOUGH FOR THIS JOB, and NOS-65 is the fix.
    # Also from the same page: the schedule event "can be delayed during periods
    # of high loads" and "some queued jobs may be dropped" - against a supplier
    # hold of 15 minutes. And, worst: "In a public repository, scheduled
    # workflows are automatically disabled when no repository activity has
    # occurred in 60 days." This repository is public, so the only thing that
    # rescues a guest who was charged switches itself off after 60 quiet days,
    # with no notification. Cloud Scheduler is the right home for both jobs.
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Call sweep endpoint
        run: |
          curl -fsS -X POST "${{ vars.APP_URL }}/api/cron/sweep" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
