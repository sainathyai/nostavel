name: Cron - sweep abandoned holds

# MANUAL FALLBACK ONLY. Cloud Scheduler owns this job
# (infra/envs/uat/scheduler.tf); the `schedule:` block that used to live here is
# gone, and the runbook's section 6 is why this file still exists at all.
#
# WHY THE SCHEDULE WENT, with numbers rather than a preference. GitHub's
# `schedule` event delivered 13 of an expected 808 sweeper runs over 67.3 hours
# (1.6%), worst observed gap 9h41m against a supplier hold of 15 minutes, with
# every one of those 13 runs reporting success - so there was no failure signal
# anywhere. It also has a 5-minute floor below which nothing fires at all, and on
# a public repository it disables itself after 60 quiet days, silently.
#
# WHY IT WENT NOW, rather than on the day the replacement landed. The runbook
# required the replacement to be proven first, because removing a broken trigger
# before its replacement works leaves none. Measured over the 95.3 hours from
# 2026-10-15 14:35Z: 1138 completed passes authorised by Cloud Scheduler against
# 1145 expected at `*/5`, which is 99.4%, and the 7-tick deficit is fully
# accounted for (6 from the deliberate alarm test, 1 late tick). Worst gap
# outside that test was 10m01s, inside both the 20-minute alarm window and the
# 15-minute hold. Over those same four days this workflow's schedule fired 27
# times - 1.6% again, independently - each one a second sweeper acting on rows
# the real one had already swept.
#
# `workflow_dispatch` stays. It authorises with the shared secret
# (`via=shared-secret` in the logs), which is deliberately NOT what the sweep
# alarm counts: a dead Scheduler job must not be maskable by the trigger it
# replaced. See docs/runbooks/cron-jobs.md section 6 before using it.
on:
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Call sweep endpoint
        run: |
          curl -fsS -X POST "${{ vars.APP_URL }}/api/cron/sweep" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
