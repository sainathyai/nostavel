name: CI

# The four checks docs/conventions.md section 7 requires locally, run on every
# pull request and on main so "it works on my machine" can't ship silently.
#
# Needs NO secrets. The database client connects on first query, not on import
# (src/db/index.ts), so lint, types, tests and build all run without
# credentials. That matters on a public repository: pull requests from forks
# never receive secrets.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Same rules as the pre-commit hook, applied to every tracked file, so a
      # commit made with --no-verify is still caught here.
      - name: Repository guard
        run: npm run guard

      # The provider-neutral agent layer (.agents/README.md): guard and generator
      # tests, then fail if any tool's generated config drifted from its source.
      - name: Agent layer tests
        run: npm run test:agents

      - name: Agent adapters up to date
        run: npm run agents:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
